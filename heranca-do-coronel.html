<script>
/* ============ DADOS DO CASO ============ */
const CASO = {
  id: "heranca",
  titulo: "A Herança do Coronel",
  resumo: `<p>Domingo, 6h30. Benedita, a cozinheira da <b>Fazenda Boa Esperança</b>, no sul de Minas, subiu com o café e encontrou o <b>Coronel Aurélio Bastos</b>, 78 anos, morto na cama.</p>
<p>Na véspera, no jantar de família, o Coronel anunciou que chamaria o tabelião na segunda-feira para mudar o testamento, "para corrigir uma injustiça". O médico da cidade desconfiou da morte e chamou a polícia.</p>
<p>Vocês dois são os detetives do caso. <b>Cada um recebeu uma pasta diferente, e nenhuma das duas resolve o caso sozinha.</b> Conversem, troquem informações e descubram quem matou, como e por quê.</p>`,
  pessoas: [
    ["Rodrigo Bastos", "50 anos, filho mais velho. Administra a fazenda."],
    ["Helena Bastos", "45 anos, filha. Médica em Belo Horizonte, de visita no fim de semana."],
    ["Tiago Bastos", "26 anos, sobrinho criado pelo Coronel. Mora na fazenda."],
    ["Zuleide", "58 anos, enfermeira do Coronel há três anos."],
    ["Genésio", "61 anos, capataz. Mora na casa do capataz, a 200 metros da sede."],
    ["Benedita", "64 anos, cozinheira. Encontrou o corpo."]
  ],
  titPessoas: "Quem estava na fazenda naquela noite",
  titLugar: "A casa",
  lugar: `<p>Na casa-sede, a <b>copa</b> fica entre a cozinha e a <b>porta dos fundos</b>, que dá para o terreiro de terra vermelha e para o alpendre onde ficam as botinas e o tanque. A <b>varanda da frente</b> é coberta e ladrilhada; dela se chega à sala sem passar pela copa. Os quartos ficam no andar de cima.</p>`,

  pastas: {
    azul: { nome: "Pasta Azul", jogador: "Detetive 1", desc: "depoimentos da enfermeira, da cozinheira, do capataz e do filho", docs: [
      { t: "Depoimento de Zuleide", tipo: "enfermeira", c: `
<p>"Todo dia, às 21h45, eu preparo o chá de camomila do Coronel. No sábado foi igual: deixei a xícara na bandeja, em cima do aparador da copa, e subi para dar os comprimidos da noite. Fiquei uns dez minutos no quarto com ele, até umas 21h55, ajeitando o travesseiro e medindo a pressão: 14 por 9.</p>
<p>Desci, peguei a bandeja e levei o chá. Ele tomou tudo por volta das 22h. Lá pelas 23h reclamou de enjoo e disse que estava vendo tudo meio amarelado. Achei que era o jantar pesado e dei um chá de boldo. Me arrependo muito.</p>
<p>O remédio do coração dele, em gotas, fica na cristaleira da copa, porque ele toma de manhã, no café. Ah, e na sexta a Dona Helena me pediu para ver esse frasco. Ficou olhando o rótulo um tempão."</p>` },
      { t: "Depoimento de Benedita", tipo: "cozinheira", c: `
<p>"O jantar de sábado foi uma briga só. O Coronel e o seu Rodrigo discutiram por causa de dinheiro; o Coronel bateu na mesa e disse que não pagava dívida de baralho de ninguém. Depois veio aquela história do testamento. O Tiago ficou branco, nem terminou o prato.</p>
<p>Lavei a louça e, às 21h40, passei pano no chão da copa e da cozinha, como faço toda noite. Deixei brilhando. Fui dormir no meu quartinho, atrás da cozinha, antes das 22h. Não ouvi nada, a chuva estava forte no telhado.</p>
<p>Domingo cedo, quando entrei na copa, tinha marca de botina com barro vermelho, já seco, indo da porta dos fundos até a cristaleira e voltando. Fiquei brava, achei que era gente da lida. Depois subi com o café e encontrei o Coronel."</p>` },
      { t: "Depoimento de Genésio", tipo: "capataz", c: `
<p>"Sábado à tarde, umas 16h, fui falar com o Coronel no escritório. Fazia dois meses que andava sumindo bezerro da invernada de baixo, e eu descobri quem vendia, escondido e sem nota, para o Otacílio, de Três Pontas: era o Tiago. Contei tudo. O Coronel ficou calado um tempão e depois disse: 'Segunda-feira eu tiro esse menino do testamento.'</p>
<p>À noite choveu forte. Umas 21h20 fui ao curral ver se a porteira estava fechada, e o Tiago estava lá, de capa, mexendo no caminhão. Me disse: 'Você não viu nada, velho.' Fui para casa e não saí mais. Não pus o pé na casa-sede naquela noite."</p>` },
      { t: "Depoimento de Rodrigo", tipo: "filho", c: `
<p>"Sim, tenho dívidas, não vou esconder. Devo ao Marcão, de Varginha, e meu pai se recusou a pagar. Discutimos no jantar, mas eu jamais faria mal a ele.</p>
<p>Depois do jantar fui para a varanda da frente ligar para o Marcão e negociar prazo. Fiquei quase uma hora pendurado no telefone, andando de um lado para o outro. A varanda é coberta, não tomei um pingo de chuva. Minha irmã passou por perto e me viu.</p>
<p>Quem ganhava com o testamento novo? Todo mundo achava que era o Tiago. Meu pai vivia dizendo que ele era o filho que não teve."</p>` },
      { t: "Registro de chamadas do celular de Rodrigo", tipo: "perícia", c: `
<p>Extraído do aparelho pela perícia, com autorização dele.</p>
<table><tr><th>Início</th><th>Contato</th><th>Duração</th></tr>
<tr><td>21h28</td><td>Marcão (Varginha)</td><td>49 min (até 22h17)</td></tr>
<tr><td>22h20</td><td>Marcão (Varginha)</td><td>3 min</td></tr></table>` },
      { t: "Ficha de entrega de botinas (EPI)", tipo: "documento", c: `
<p>Encontrada numa gaveta do escritório do Coronel. Todo ano a fazenda compra o mesmo modelo de botina de couro, de solado tratorado, para os homens da casa e da lida.</p>
<table><tr><th>Nome</th><th>Número da botina</th></tr>
<tr><td>Coronel Aurélio</td><td>40</td></tr>
<tr><td>Rodrigo</td><td>42</td></tr>
<tr><td>Tiago</td><td>42</td></tr>
<tr><td>Genésio</td><td>39</td></tr>
<tr><td>Joaquim (peão; passou o fim de semana em Varginha)</td><td>41</td></tr></table>
<p>Helena e Zuleide não constam da ficha.</p>` }
    ]},
    verm: { nome: "Pasta Vermelha", jogador: "Detetive 2", desc: "perícia, laudo e depoimentos do sobrinho e da filha", docs: [
      { t: "Laudo preliminar do legista", tipo: "perícia", c: `
<p><b>Causa provável da morte:</b> intoxicação por digoxina, o remédio que o Coronel tomava para o coração, em dose muitas vezes maior que a receitada.</p>
<p>Sintomas típicos: enjoo, confusão e visão amarelada. Pelo tempo de ação, a dose foi ingerida entre 21h30 e 22h30 de sábado.</p>
<p>Havia resíduo de digoxina na xícara de chá encontrada no quarto. Não há sinais de violência.</p>` },
      { t: "Controle de medicamentos e frasco", tipo: "perícia", c: `
<p><b>Anotação da enfermeira:</b> digoxina em gotas (solução oral), frasco de 60 ml, aberto novo na sexta de manhã. Dose: 1 ml por dia, de manhã, no café.</p>
<p><b>Conferência da perícia, domingo:</b> o frasco estava na cristaleira da copa com cerca de 20 ml. Descontadas as duas doses de sexta e sábado, <b>sumiram cerca de 38 ml</b>. O frasco foi limpo com pano: não há digitais de ninguém.</p>` },
      { t: "Pluviômetro da fazenda", tipo: "registro", c: `
<p>Estação automática ao lado do curral.</p>
<table><tr><th>Horário</th><th>Chuva</th></tr>
<tr><td>até 21h05</td><td>tempo seco</td></tr>
<tr><td>21h05 às 21h50</td><td>chuva forte (38 mm)</td></tr>
<tr><td>depois de 21h50</td><td>céu limpo</td></tr></table>` },
      { t: "Fotos da perícia: a copa", tipo: "perícia", c: `
<p>Pegadas de barro vermelho saem da porta dos fundos, vão até a cristaleira e voltam para a porta. Solado tratorado.</p>
<p><b>Comprimento da pegada: 28 cm</b>, compatível com botina número 42. Para comparar: uma botina 39 mede cerca de 26 cm, e uma 40 cerca de 26,5 cm.</p>` },
      { t: "Fotos da perícia: o alpendre dos fundos", tipo: "perícia", c: `
<p>Domingo, 7h. As botinas da casa ficam enfileiradas no alpendre, e cada dono marca as iniciais a canivete no cano.</p>
<p>Todos os pares estão secos e com barro velho, <b>exceto um par número 42</b>: lavado, ainda molhado, virado de ponta-cabeça no tanque. O couro do cano foi escovado com força, e as iniciais não dão para ler.</p>
<p>O outro par número 42 da fileira, marcado "R", está seco e com barro antigo.</p>` },
      { t: "Depoimento de Tiago", tipo: "sobrinho", c: `
<p>"Meu tio era como um pai para mim. Ele ia mudar o testamento para me deixar a fazenda, todo mundo sabe. Ele falou em 'corrigir uma injustiça', e a injustiça era eu não ser filho de sangue. Por que eu mataria quem ia me dar tudo?</p>
<p>No sábado, depois do jantar, fui para o quarto às nove e dormi. Não saí de casa, estava chovendo.</p>
<p>Se querem um suspeito, olhem o Genésio. Ele vinha roubando bezerro, e meu tio descobriu. Ia mandar ele embora na segunda."</p>` },
      { t: "Depoimento de Helena", tipo: "filha", c: `
<p>"Sou médica. Na sexta pedi para ver o frasco do remédio do meu pai porque ele andava confuso, e quis conferir a dose. Estava certa.</p>
<p>No sábado, depois do jantar, fiquei no meu quarto em videochamada com meu marido e meus filhos, das 21h35 às 22h30; podem conferir no celular. Lá pelas 21h50 desci para pegar água, com o celular na mão, ainda na chamada. Passei pela sala e vi o Rodrigo na varanda da frente, falando alto no telefone. Fui até a cozinha e voltei. A porta da copa estava encostada, não vi ninguém lá.</p>
<p>Que injustiça meu pai queria corrigir? Sinceramente, não sei. Ele guardava tudo."</p>` },
      { t: "Recibo no quarto de Tiago", tipo: "busca", c: `
<p>Encontrado no bolso de uma capa de chuva ainda úmida, pendurada atrás da porta do quarto de Tiago. Manuscrito:</p>
<p style="font-style:italic">"Recebi de Otacílio Prado a quantia de R$ 18.000,00 referente a 6 (seis) bezerros. Ass.: Tiago Bastos."</p>` }
    ]}
  },

  perguntas: [
    { id:"quem", t:"Quem matou o Coronel?", certa:"tiago", ops:[
      ["rodrigo","Rodrigo, o filho"],["helena","Helena, a filha"],["tiago","Tiago, o sobrinho"],
      ["zuleide","Zuleide, a enfermeira"],["genesio","Genésio, o capataz"] ]},
    { id:"como", t:"Como foi feito?", certa:"cha", ops:[
      ["cha","Pôs o remédio do coração, em gotas, no chá, enquanto a bandeja esperava na copa"],
      ["compr","Trocou os comprimidos da noite por outros mais fortes"],
      ["trav","Sufocou o Coronel com o travesseiro durante a madrugada"],
      ["jantar","Envenenou a comida do jantar"] ]},
    { id:"porque", t:"Por quê?", certa:"testamento", ops:[
      ["dividas","O Coronel se recusou a pagar as dívidas de jogo dele"],
      ["testamento","O Coronel ia tirá-lo do testamento, porque descobriu a venda escondida de bezerros"],
      ["demissao","Ia ser demitido na segunda-feira"],
      ["vender","Queria vender logo a sua parte da fazenda"] ]},
    { id:"prova", t:"O que derruba a versão do culpado?", certa:"pegada", ops:[
      ["pegada","A pegada 42 de barro, feita depois do pano das 21h40, e o Genésio tê-lo visto fora de casa na chuva"],
      ["ligacao","O registro de chamadas do celular"],
      ["frasco","O frasco limpo, sem digitais"],
      ["pressao","A pressão de 14 por 9 medida pela enfermeira"] ]}
  ],

  solucao: `<p><b>Tiago</b> matou o tio. Todos achavam que o testamento novo o beneficiaria, mas era o contrário: às 16h, Genésio contou ao Coronel que Tiago vendia bezerros escondido, e o Coronel decidiu tirá-lo do testamento na segunda-feira. No jantar, quando o tio falou em "corrigir uma injustiça", Tiago entendeu que tinha sido descoberto.</p>
<p>Na chuva, ele foi ao caminhão buscar o dinheiro e o recibo da venda e deu de cara com Genésio. Por volta das 21h50, entrou pela porta dos fundos com a botina enlameada. A copa estava vazia: Zuleide tinha subido e deixado o chá na bandeja. Ele despejou cerca de 38 ml do remédio no chá, limpou o frasco e saiu. No escuro, não viu as pegadas no chão recém-limpo. Depois lavou a botina no tanque e esfregou as iniciais.</p>`,
  cadaUm: [
    ["Rodrigo","Tinha dívidas de jogo e brigou com o pai, mas passou a janela do crime ao telefone na varanda coberta. O par \"R\" estava seco."],
    ["Helena","Conferiu o frasco na sexta só para checar a dose. Estava em videochamada na hora do crime e não passou pela copa."],
    ["Zuleide","Preparou o chá, mas estava no quarto com o Coronel quando o veneno foi posto. Seu erro foi achar que era indigestão."],
    ["Genésio","Tiago tentou jogar a culpa nele. Foi ele quem denunciou a venda dos bezerros, e calça 39: a pegada não é dele."]
  ],
  linha: [
    ["16h00","Genésio conta ao Coronel sobre os bezerros vendidos por Tiago."],
    ["20h00","Jantar: briga com Rodrigo e o anúncio do testamento."],
    ["21h00","Tiago diz que vai dormir."],
    ["21h05","Começa a chuva forte."],
    ["21h20","Genésio vê Tiago no caminhão: \"Você não viu nada, velho.\""],
    ["21h28","Rodrigo começa a ligação na varanda."],
    ["21h35","Helena inicia a videochamada."],
    ["21h40","Benedita passa pano na copa."],
    ["21h45","Zuleide deixa o chá na copa e sobe."],
    ["21h50","Tiago entra pelos fundos e põe o remédio no chá. A chuva para."],
    ["21h55","Zuleide desce e leva o chá."],
    ["22h00","O Coronel toma o chá."],
    ["23h00","Enjoo e visão amarelada."],
    ["06h30","Benedita encontra o corpo."]
  ]
};
