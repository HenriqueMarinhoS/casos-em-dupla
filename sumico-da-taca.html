<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>O Sumiço da Taça</title>
<style>
:root{
  --bg:#f3ede1; --papel:#fffaf0; --tinta:#2b2520; --suave:#6d6358; --linha:#d9cfbd;
  --azul:#2f5d8a; --azul-f:#e6eef6; --verm:#9a3328; --verm-f:#f6e7e4;
  --ok:#2e7d4f; --erro:#b23a2e; --destaque:#b8862b;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1c1a17; --papel:#262320; --tinta:#ece5d8; --suave:#a89e90; --linha:#3d3832;
    --azul:#7fa9d4; --azul-f:#1f2b38; --verm:#e08a7e; --verm-f:#3a2522;
    --ok:#6cc08e; --erro:#ef7f73; --destaque:#d9ad5b;
  }
}
:root[data-theme="dark"]{
  --bg:#1c1a17; --papel:#262320; --tinta:#ece5d8; --suave:#a89e90; --linha:#3d3832;
  --azul:#7fa9d4; --azul-f:#1f2b38; --verm:#e08a7e; --verm-f:#3a2522;
  --ok:#6cc08e; --erro:#ef7f73; --destaque:#d9ad5b;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tinta);font:17px/1.6 Georgia,"Times New Roman",serif}
.pag{max-width:760px;margin:0 auto;padding:24px 16px 64px}
h1{font-size:2rem;margin:.2em 0 .1em;letter-spacing:.5px}
h2{font-size:1.25rem;margin:1.6em 0 .5em}
.sub{color:var(--suave);margin:0 0 1.2em;font-style:italic}
.cartao{background:var(--papel);border:1px solid var(--linha);border-radius:8px;padding:16px 18px;margin:12px 0}
.pessoas{margin:0;padding-left:1.1em}
.pessoas li{margin:.25em 0}
.botoes{display:grid;gap:12px;margin:18px 0}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--linha);background:var(--papel);color:var(--tinta);padding:12px 16px;text-align:left}
button:hover{border-color:var(--suave)}
button.azul{border-left:6px solid var(--azul)}
button.verm{border-left:6px solid var(--verm)}
button.prim{background:var(--tinta);color:var(--papel);border-color:var(--tinta);text-align:center}
button.link{background:none;border:none;color:var(--suave);text-decoration:underline;padding:4px 0;font-size:.9rem}
button small{display:block;color:var(--suave);font-size:.85rem}
button.prim small{color:inherit;opacity:.8}
.faixa{display:inline-block;padding:2px 10px;border-radius:99px;font-size:.85rem;font-family:system-ui,sans-serif}
.faixa.azul{background:var(--azul-f);color:var(--azul)}
.faixa.verm{background:var(--verm-f);color:var(--verm)}
.doc{border-left:4px solid var(--linha)}
.doc.azul{border-left-color:var(--azul)}
.doc.verm{border-left-color:var(--verm)}
.doc summary{cursor:pointer;font-weight:bold;list-style:none}
.doc summary::-webkit-details-marker{display:none}
.doc summary::before{content:"▸ ";color:var(--suave)}
.doc[open] summary::before{content:"▾ "}
.doc .tipo{font-weight:normal;color:var(--suave);font-size:.85rem;font-family:system-ui,sans-serif;margin-left:6px}
.doc p{margin:.7em 0}
table{border-collapse:collapse;width:100%;font-size:.95rem;margin:.6em 0}
th,td{border:1px solid var(--linha);padding:6px 8px;text-align:left}
th{background:var(--bg)}
textarea{width:100%;min-height:120px;font:inherit;font-size:.95rem;padding:10px;border-radius:8px;border:1px solid var(--linha);background:var(--papel);color:var(--tinta)}
.perg{margin:18px 0}
.perg label{display:block;padding:8px 10px;border:1px solid var(--linha);border-radius:6px;margin:6px 0;background:var(--papel);cursor:pointer}
.perg label:hover{border-color:var(--suave)}
.perg input{margin-right:8px}
.aviso{background:var(--verm-f);border:1px solid var(--verm);color:var(--tinta);padding:10px 14px;border-radius:8px;font-size:.95rem}
.nota{font-size:2.4rem;font-weight:bold;margin:.2em 0}
.certo{color:var(--ok)} .errado{color:var(--erro)}
.linha-tempo{list-style:none;padding:0;margin:0}
.linha-tempo li{padding:6px 0 6px 76px;position:relative;border-bottom:1px dashed var(--linha)}
.linha-tempo b{position:absolute;left:0;width:68px;color:var(--destaque);font-family:system-ui,sans-serif;font-size:.9rem;top:8px}
.escondido{display:none}
.topo{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
@media (max-width:520px){ body{font-size:16px} h1{font-size:1.6rem} }
</style>
</head>
<body>
<div class="pag" id="app"></div>

<script>
/* ============ DADOS DO CASO ============ */
const CASO = {
  id: "taca",
  titulo: "O Sumiço da Taça",
  resumo: `<p>Domingo, 8h. Seu Nonato, zelador do <b>Ferroviário Atlético Clube</b>, de Pedra Branca do Oeste, abriu a sala de troféus e encontrou a vitrine aberta, sem nenhum arrombamento. A <b>Taça do Tricampeonato Estadual de 1971</b>, orgulho da cidade, tinha sumido.</p>
<p>Na noite anterior, o clube fez a festa do seu centenário no salão social, colado à sala de troféus. O ponto alto foi a homenagem a Baltazar "Canhão", autor do gol do título de 1971. A taça está no seguro por R$ 400 mil.</p>
<p>Vocês dois são os detetives. <b>Cada um recebeu uma pasta diferente, e nenhuma das duas resolve o caso sozinha.</b> Descubram quem tirou a taça da sala, quem estava por trás, como ela saiu do clube e por quê.</p>`,
  pessoas: [
    ["Dr. Álvaro Menezes", "62 anos, presidente do clube há oito anos. Candidato à reeleição no mês que vem."],
    ["Márcia Leal", "48 anos, tesoureira do clube. Adversária do presidente na eleição."],
    ["Seu Nonato", "67 anos, zelador há trinta anos. Encontrou a vitrine aberta."],
    ["Baltazar \"Canhão\"", "76 anos, ex-centroavante, autor do gol do tri. O homenageado da noite."],
    ["Kaique", "22 anos, neto de Baltazar. Foi o DJ da festa."],
    ["Wander", "40 anos, fotógrafo contratado para o livro do centenário."]
  ],
  casa: `<p>O <b>salão social</b> tem o palco numa ponta e a <b>cabine do DJ</b> na outra, ao lado da única porta da <b>sala de troféus</b>. A sala tem janelas com grade, intactas. O alarme da sala só se desliga com código, e <b>cada pessoa tem o seu código</b>, que fica registrado no sistema com o nome do dono. A vitrine da taça fecha com chave. O estacionamento fica nos fundos, junto à porta de carga do salão.</p>`,

  pastas: {
    azul: { nome: "Pasta Azul", jogador: "Detetive 1", desc: "depoimentos do zelador, do homenageado, da tesoureira e do presidente", docs: [
      { t: "Depoimento de Seu Nonato", tipo: "zelador", c: `
<p>"Meu código do alarme é 1971, o ano do tri. Não é segredo para ninguém da diretoria, porque o presidente vive me pedindo para desligar o alarme quando quer mostrar a sala para visita. A chave da vitrine só eu e o presidente temos. A minha ficou no meu bolso a noite toda.</p>
<p>Na festa eu não trabalhei, fui convidado. Dancei a noite inteira com a minha patroa. Na hora da homenagem ao Canhão, apagaram as luzes para passar o vídeo no telão, e eu estava na frente do palco, chorando feito criança.</p>
<p>Domingo cedo abri a sala e a vitrine estava aberta, sem um arranhão. Estão dizendo que fui eu por causa do código. Trinta anos de clube, doutor."</p>` },
      { t: "Depoimento de Baltazar \"Canhão\"", tipo: "homenageado", c: `
<p>"Aquela taça é minha de coração, fui eu que fiz o gol. Mas nunca botei a mão nela sem pedir. O clube me prometeu meu nome no estádio há vinte anos e nunca cumpriu. Isso dói, mas não vira roubo.</p>
<p>Na homenagem, subi no palco com o presidente e a Márcia. Apagaram as luzes, passou o vídeo do gol, e quando acendeu eu procurei meu neto lá no fundo, para ele ver o avô. A cabine do som estava vazia; a música tocava sozinha. Achei estranho, ele não sai dali por nada.</p>
<p>Fui embora umas 23h30 com a minha filha. Levei só a placa que me deram."</p>` },
      { t: "Depoimento de Márcia Leal", tipo: "tesoureira", c: `
<p>"Vou ser franca: quero ver o Álvaro fora da presidência, e esse sumiço acaba com ele na eleição. Mas eu não preciso roubar nada para ganhar.</p>
<p>O clube deve R$ 1,2 milhão ao banco. E tem uma coisa que ninguém lembra: dois meses atrás o Álvaro renovou o seguro da taça e subiu o valor de R$ 80 mil para R$ 400 mil. Votei contra; a taça é história, não é dinheiro. Ele passou por cima.</p>
<p>Eu sei o código do Nonato, como todo mundo. Na hora do apagão eu estava no palco, entregando a placa ao Canhão."</p>` },
      { t: "Depoimento do Dr. Álvaro Menezes", tipo: "presidente", c: `
<p>"Estou arrasado. Essa taça é a alma do clube. Na homenagem eu estava no palco, ao lado do Baltazar, na frente de trezentas pessoas.</p>
<p>O seguro? Renovação de rotina, o valor antigo estava defasado. Eu jamais daria meu código a alguém. Agora, o Nonato é descuidado, conta o código dele para meio mundo. Não digo que foi ele, mas é o primeiro lugar onde eu olharia."</p>` },
      { t: "Registro do sistema de alarme", tipo: "perícia", c: `
<p>Sala de troféus, noite de sábado para domingo.</p>
<table><tr><th>Horário</th><th>Evento</th><th>Código usado</th></tr>
<tr><td>19h40</td><td>Alarme armado</td><td>Nonato</td></tr>
<tr><td>23h11</td><td>Alarme desarmado</td><td>Nonato</td></tr>
<tr><td>23h14</td><td>Alarme armado</td><td>Nonato</td></tr>
<tr><td>08h02 (domingo)</td><td>Alarme desarmado</td><td>Nonato</td></tr></table>` },
      { t: "Contrato do DJ", tipo: "documento", c: `
<p>Contrato assinado pelo clube com Kaique para tocar na festa do centenário, das 20h às 01h, com equipamento próprio.</p>
<p><b>Valor combinado: R$ 1.500,00</b>, a serem pagos pela tesouraria do clube na segunda-feira seguinte à festa.</p>
<p>Assinam: Márcia Leal (tesoureira) e Kaique.</p>` }
    ]},
    verm: { nome: "Pasta Vermelha", jogador: "Detetive 2", desc: "fotos da festa, câmera, extrato e depoimentos do DJ e do fotógrafo", docs: [
      { t: "Roteiro da festa", tipo: "documento", c: `
<table><tr><th>Horário</th><th>Programação</th></tr>
<tr><td>20h00</td><td>Abertura e jantar</td></tr>
<tr><td>22h30</td><td>Baile</td></tr>
<tr><td>23h10</td><td>Luzes apagadas: vídeo do gol de 1971 no telão (3 minutos)</td></tr>
<tr><td>23h13</td><td>Luzes acesas: homenagem a Baltazar "Canhão" no palco</td></tr>
<tr><td>01h00</td><td>Encerramento</td></tr></table>` },
      { t: "Fotos de Wander, com horário", tipo: "perícia", c: `
<p>A câmera grava o horário de cada foto.</p>
<table><tr><th>Horário</th><th>O que aparece</th></tr>
<tr><td>22h04</td><td>A cabine do DJ. Kaique mexe na mesa de som. Atrás dele, um <b>case de som grande, com a tampa aberta e vazio</b>.</td></tr>
<tr><td>23h09</td><td>A pista de dança. Seu Nonato dança com a esposa.</td></tr>
<tr><td>23h11</td><td>O salão no escuro, com o vídeo do gol no telão.</td></tr>
<tr><td>23h13</td><td>O palco: Baltazar, o presidente Álvaro e Márcia com a placa. Seu Nonato aplaude na primeira fila. Ao fundo, a <b>cabine do DJ está vazia</b>.</td></tr>
<tr><td>23h16</td><td>Kaique de volta à cabine, suado. O case de som atrás dele está <b>fechado</b>.</td></tr></table>` },
      { t: "Depoimento de Wander", tipo: "fotógrafo", c: `
<p>"Fotografei a festa inteira, do salão, sem parar; está tudo na câmera. Na hora do vídeo fiquei no meio do salão, fotografando o telão.</p>
<p>Uma coisa me chamou atenção antes da festa. Na quinta-feira, o presidente me pediu fotos da taça bem de perto, de todos os ângulos, com as marcas e os arranhões. Disse que eram para o seguro. Fiz e mandei só para ele."</p>` },
      { t: "Depoimento de Kaique", tipo: "DJ", c: `
<p>"Eu não saí da cabine a noite toda. Na hora do apagão, soltei o vídeo e fiquei lá, cuidando do som. Se meu avô não me viu, é porque estava escuro.</p>
<p>Aquele case eu uso para carregar caixa de som, cabo, tudo. O Pix do presidente? Foi adiantamento do cachê e um dinheiro para eu comprar equipamento novo para o clube. Pode perguntar para ele."</p>` },
      { t: "Pix no celular de Kaique", tipo: "busca", c: `
<p>Comprovante encontrado no celular de Kaique, com autorização dele.</p>
<table><tr><th>Data</th><th>De</th><th>Valor</th><th>Mensagem</th></tr>
<tr><td>sexta-feira, véspera da festa</td><td>Álvaro M. Menezes (conta pessoal)</td><td>R$ 20.000,00</td><td>"som da festa"</td></tr></table>
<p>Não há nenhum outro pagamento do clube ou do presidente para Kaique.</p>` },
      { t: "Câmera do estacionamento", tipo: "perícia", c: `
<table><tr><th>Horário</th><th>O que aparece</th></tr>
<tr><td>18h55</td><td>Kaique chega e descarrega o equipamento. Leva o case grande <b>sozinho, com uma mão só</b>.</td></tr>
<tr><td>23h35</td><td>Baltazar e a filha vão embora. Ele leva só a placa debaixo do braço.</td></tr>
<tr><td>01h35</td><td>Kaique carrega o case grande para o carro. Precisa <b>arrastar, parar duas vezes e usar as duas mãos</b>. As caixas de som vão num carrinho separado.</td></tr></table>` },
      { t: "Contrato de empréstimo do clube", tipo: "documento", c: `
<p>Encontrado na tesouraria. Empréstimo de R$ 1,2 milhão do Banco do Oeste ao Ferroviário Atlético Clube.</p>
<p><b>Avalista: Dr. Álvaro Menezes, pessoalmente</b>. Ele garante a dívida com os bens próprios.</p>
<p>Anotação do banco, de 30 dias atrás: "Parcelas em atraso. Sem pagamento em 60 dias, execução do aval: penhora do imóvel residencial do avalista."</p>` }
    ]}
  },

  perguntas: [
    { id:"quem", t:"Quem tirou a taça da sala de troféus?", certa:"kaique", ops:[
      ["nonato","Seu Nonato, o zelador"],["baltazar","Baltazar \"Canhão\""],["kaique","Kaique, o DJ"],
      ["marcia","Márcia, a tesoureira"],["alvaro","Dr. Álvaro, o presidente"],["wander","Wander, o fotógrafo"] ]},
    { id:"mandante", t:"Quem estava por trás do sumiço?", certa:"alvaro", ops:[
      ["ninguem","Ninguém: quem tirou a taça agiu sozinho"],["alvaro","O presidente Álvaro"],
      ["marcia","A tesoureira Márcia"],["baltazar","O avô, Baltazar"] ]},
    { id:"como", t:"Como a taça saiu do clube?", certa:"case", ops:[
      ["case","Dentro do case de som, levado para o carro do DJ no fim da festa"],
      ["janela","Pela janela da sala de troféus"],
      ["placa","Com Baltazar, junto com a placa da homenagem"],
      ["salao","Ficou escondida no salão até domingo"] ]},
    { id:"porque", t:"Por quê?", certa:"seguro", ops:[
      ["seguro","Para o clube receber o seguro de R$ 400 mil e pagar a dívida garantida com a casa do presidente"],
      ["eleicao","Para derrubar o presidente na eleição"],
      ["avo","Para dar ao avô a taça que ele acha que é dele"],
      ["vender","Para vender a taça a um colecionador"] ]}
  ],

  solucao: `<p><b>Kaique tirou a taça, a mando do presidente Álvaro.</b></p>
<p>O clube devia R$ 1,2 milhão, e o próprio Álvaro era o avalista: se a dívida não fosse paga, o banco tomaria a casa dele. Dois meses antes, ele subiu o seguro da taça de R$ 80 mil para R$ 400 mil. Na quinta, pediu a Wander fotos detalhadas "para o seguro". Na sexta, pagou R$ 20 mil a Kaique da conta pessoal, muito mais que o cachê de R$ 1.500.</p>
<p>Durante o apagão das 23h10, Kaique saiu da cabine, que fica ao lado da porta da sala. Ele desarmou o alarme com o código de Nonato, que Álvaro escolheu para jogar a culpa no zelador, e abriu a vitrine com a cópia da chave do presidente. Guardou a taça no case de som vazio e rearmou o alarme às 23h14. Enquanto isso, Álvaro estava no palco, à vista de trezentas pessoas, com o álibi perfeito. À 01h35, Kaique arrastou o case, agora pesado, até o carro.</p>`,
  cadaUm: [
    ["Seu Nonato","O código dele foi usado de propósito, mas as fotos o mostram na pista às 23h09 e na primeira fila às 23h13."],
    ["Baltazar","Tinha mágoa do clube, mas estava no palco durante o apagão e saiu levando só a placa. Sem querer, foi ele quem notou a cabine vazia."],
    ["Márcia","Ganharia a eleição com o escândalo, mas estava no palco. Foi quem revelou o aumento do seguro."],
    ["Wander","Fez as fotos da taça sem saber para quê. Fotografou do salão a noite inteira, e as fotos dele desmontaram o álibi de Kaique."]
  ],
  linha: [
    ["2 meses","Álvaro sobe o seguro da taça de R$ 80 mil para R$ 400 mil."],
    ["Quinta","Álvaro pede a Wander fotos detalhadas da taça."],
    ["Sexta","Pix de R$ 20 mil de Álvaro para Kaique."],
    ["18h55","Kaique chega e leva o case vazio com uma mão só."],
    ["22h04","Foto: o case vazio e aberto atrás da cabine."],
    ["23h09","Foto: Nonato dançando."],
    ["23h10","Luzes apagadas: vídeo do gol no telão."],
    ["23h11","Alarme desarmado com o código de Nonato."],
    ["23h13","Luzes acesas. Foto: Álvaro, Márcia e Baltazar no palco; cabine vazia."],
    ["23h14","Alarme armado de novo."],
    ["23h16","Foto: Kaique de volta; o case fechado."],
    ["23h35","Baltazar vai embora com a placa."],
    ["01h35","Kaique arrasta o case pesado até o carro."],
    ["08h02","Nonato encontra a vitrine aberta."]
  ]
};

/* ============ MOTOR ============ */
const app = document.getElementById("app");
const guardar = (k,v)=>{ try{ localStorage.setItem("caso-"+CASO.id+":"+k, v); }catch(e){} };
const ler = k=>{ try{ return localStorage.getItem("caso-"+CASO.id+":"+k) || ""; }catch(e){ return ""; } };
let papel = null;

function cabecalho(){
  return `<h1>${CASO.titulo}</h1><p class="sub">Um caso para dois detetives</p>`;
}
function blocoComum(){
  return `<div class="cartao">${CASO.resumo}</div>
<h2>Quem estava na fazenda naquela noite</h2>
<div class="cartao"><ul class="pessoas">${CASO.pessoas.map(p=>`<li><b>${p[0]}</b>: ${p[1]}</li>`).join("")}</ul></div>
<h2>O clube</h2><div class="cartao">${CASO.casa}</div>`;
}

function inicio(){
  papel = null;
  app.innerHTML = cabecalho() + `
<div class="cartao">
<p><b>Como se joga</b></p>
<ul class="pessoas">
<li>Cada um abre este arquivo no próprio aparelho e escolhe uma pasta: um fica com a <b>Azul</b>, o outro com a <b>Vermelha</b>.</li>
<li>Não mostrem a tela um para o outro. Leiam em voz alta ou contem com as próprias palavras o que cada documento diz.</li>
<li>Quando acharem que resolveram, combinem as respostas e entreguem o relatório, cada um na sua tela. Não há limite de tempo.</li>
</ul></div>
<div class="botoes">
<button class="azul" onclick="abrir('azul')">Detetive 1: Pasta Azul<small>${CASO.pastas.azul.desc}</small></button>
<button class="verm" onclick="abrir('verm')">Detetive 2: Pasta Vermelha<small>${CASO.pastas.verm.desc}</small></button>
</div>
<button class="link" onclick="abrir('ambas')">Ver as duas pastas (só para quem joga sozinho)</button>
<p><a href="index.html" style="color:var(--suave)">Todos os casos</a></p>`;
  scrollTo(0,0);
}

function docsHtml(chave){
  const p = CASO.pastas[chave];
  return p.docs.map(d=>`<details class="cartao doc ${chave}"><summary>${d.t}<span class="tipo">${d.tipo}</span></summary>${d.c}</details>`).join("");
}

function abrir(qual){
  papel = qual;
  let pastas = "";
  if(qual==="ambas"){
    pastas = `<h2><span class="faixa azul">Pasta Azul</span></h2>${docsHtml("azul")}<h2><span class="faixa verm">Pasta Vermelha</span></h2>${docsHtml("verm")}`;
  } else {
    const p = CASO.pastas[qual];
    pastas = `<h2>Sua pasta <span class="faixa ${qual}">${p.nome}</span></h2>
<p class="sub">Toque em cada documento para abrir. Seu parceiro tem outros documentos.</p>${docsHtml(qual)}`;
  }
  const rotulo = qual==="ambas" ? "Jogo solo" : CASO.pastas[qual].jogador;
  app.innerHTML = `<div class="topo"><span class="faixa ${qual==="ambas"?"azul":qual}">${rotulo}</span><button class="link" onclick="inicio()">Trocar de pasta</button></div>`
    + cabecalho() + blocoComum() + pastas + `
<h2>Suas anotações</h2>
<textarea id="notas" placeholder="Anote aqui o que o parceiro contar, horários, suspeitas...">${ler("notas-"+qual).replace(/</g,"&lt;")}</textarea>
<div class="botoes"><button class="prim" onclick="relatorio()">Ir para o relatório final<small>só quando os dois tiverem combinado as respostas</small></button></div>`;
  document.getElementById("notas").addEventListener("input", e=>guardar("notas-"+qual, e.target.value));
  scrollTo(0,0);
}

function relatorio(){
  const voltar = papel;
  app.innerHTML = cabecalho() + `<h2>Relatório final</h2>
<p class="aviso">Combinem as respostas antes de entregar. Depois da entrega, a solução aparece na tela.</p>
${CASO.perguntas.map((q,i)=>`<div class="perg"><p><b>${i+1}. ${q.t}</b></p>${q.ops.map(o=>`<label><input type="radio" name="${q.id}" value="${o[0]}">${o[1]}</label>`).join("")}</div>`).join("")}
<p id="falta" class="aviso escondido">Responda a todas as perguntas antes de entregar.</p>
<div class="botoes"><button class="prim" onclick="entregar()">Entregar o relatório</button>
<button class="link" onclick="abrir('${voltar}')">Voltar para a pasta</button></div>`;
  scrollTo(0,0);
}

function entregar(){
  const resp = {};
  for(const q of CASO.perguntas){
    const m = document.querySelector(`input[name="${q.id}"]:checked`);
    if(!m){ document.getElementById("falta").classList.remove("escondido"); return; }
    resp[q.id] = m.value;
  }
  let acertos = 0;
  const itens = CASO.perguntas.map((q,i)=>{
    const ok = resp[q.id]===q.certa; if(ok) acertos++;
    const sua = q.ops.find(o=>o[0]===resp[q.id])[1];
    const certa = q.ops.find(o=>o[0]===q.certa)[1];
    return `<li><b>${q.t}</b><br><span class="${ok?"certo":"errado"}">${ok?"✔ Certo":"✘ Errado"}</span>: ${sua}${ok?"":`<br><i>Resposta certa:</i> ${certa}`}</li>`;
  }).join("");
  const nota = (acertos*10/CASO.perguntas.length).toLocaleString("pt-BR",{minimumFractionDigits:1});
  const frase = acertos===CASO.perguntas.length ? "Caso resolvido. O culpado vai responder pelo crime."
    : acertos>=2 ? "Vocês chegaram perto, mas a defesa vai explorar as falhas do relatório."
    : "O caso ficou em aberto. O culpado segue livre, por enquanto.";
  app.innerHTML = cabecalho() + `
<div class="cartao"><p style="margin:0">Nota da dupla</p><p class="nota">${nota} / 10</p><p>${frase}</p></div>
<h2>Suas respostas</h2><div class="cartao"><ul class="pessoas">${itens}</ul></div>
<h2>O que aconteceu</h2><div class="cartao">${CASO.solucao}</div>
<h2>E os outros?</h2><div class="cartao"><ul class="pessoas">${CASO.cadaUm.map(c=>`<li><b>${c[0]}</b>: ${c[1]}</li>`).join("")}</ul></div>
<h2>A noite, hora a hora</h2><div class="cartao"><ul class="linha-tempo">${CASO.linha.map(l=>`<li><b>${l[0]}</b>${l[1]}</li>`).join("")}</ul></div>
<div class="botoes"><button onclick="inicio()">Voltar ao início</button></div>`;
  scrollTo(0,0);
}

inicio();
</script>
</body>
</html>
